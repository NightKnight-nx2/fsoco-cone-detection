# ByteTrack settings tuned for cone tracking (see Ultralytics tracker docs for all keys).
# Cones are tiny, so IoU between consecutive frames is small when the camera moves; match_thresh is
# therefore set very permissive (association cost 1-IoU up to 0.99) and lost tracks are kept for 60 frames.
# Measured on a 10 Hz Unity sequence (first 120 frames): the stock settings gave 84 track IDs
# (mean length 17 frames), these give 58 (mean 32). A higher frame rate helps far more than tuning.
tracker_type: bytetrack
track_high_thresh: 0.25   # first association threshold
track_low_thresh: 0.10    # second association (low-confidence boxes keep tracks alive)
new_track_thresh: 0.30    # min score to start a new track
track_buffer: 60          # frames to keep a lost track
match_thresh: 0.99        # association cost threshold (1 - IoU)
fuse_score: True
